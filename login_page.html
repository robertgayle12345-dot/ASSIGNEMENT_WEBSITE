<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            min-height: 100vh;
        }

        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
        }

        .navbar {
            width: 100%;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }

        .container-fluid {
            padding-left: 15px !important;
            padding-right: 15px !important;
        }

        h2,
        p {
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-container {
            width: 350px;
            height: 350px;
            /* Forces square aspect ratio */
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .navbar .nav-link:hover {
            background-color: black !important;
            color: yellow !important;
            border-radius: 5px;
        }

        .navbar .nav-link {
            color: white !important;
            font-weight: bold;
            padding: 8px 16px;
        }
        @media (min-width: 992px) {
        .navbar-nav {
            margin-left: 450px !important;
            margin-right: 0 !important;
             }
        }

        @media (max-width: 991px) {
        .navbar-nav {
            margin-left: auto !important;
            margin-right: auto !important;
            text-align: center !important;
            }
        }
    </style>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg w-100" data-bs-theme="dark"
        style="background: linear-gradient(45deg, #007bff, #6610f2);">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="img/cakelogo.png" alt="Cake Dreams Logo" width="50" height="50" class="me-2"
                    style="border: 1px solid #fff; border-radius: 5px; box-shadow: 0 0 5px rgba(255,255,255,0.5); display: inline-block;">
                <span
                    style="font-weight: bold; font-family: 'Brush Script MT', cursive; color: #FFD700; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">Cake
                    Dreams</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="#navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">HOME</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="login-wrapper">
        <div class="login-container">
            <h2>Welcome to Cake Dreams</h2>
            <p>Click below to enter the website</p>
            <button onclick="goToHome()">LOGIN</button>
        </div>
    </div>

    <script>
        function goToHome() {
            window.location.href = "cake_design_setup.html";
        }
    </script>
</body>

</html>
