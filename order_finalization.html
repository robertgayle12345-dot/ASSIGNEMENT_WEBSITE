<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Finalization</title>
    <link rel="stylesheet" href="styles.css/stylesheet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</head>

    <body style="background-color: beige">
    <div class="container " style="background-color: white; padding: 20px; border-radius: 10px; margin-top: 20px;">
   <nav class="navbar bg-primary navbar-expand-lg  " data-bs-theme="dark">

                <div class="container-fluid">
                    <a class="navbar-brand" href="#"></a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                        <div class="navbar-nav">
                            <a href="index_home_page.html">HOME PAGE</a>
                            <a href="order_finalization.html">FINALIZE YOUR ORDER HERE</a>
                            <a href="cake_design_setup.html">DESIGN YOUR CAKE HERE</a>
                            <a href="login_page.html">LOG IN HERE</a>
                        </div>
                    </div>
                </div>
            </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h1 class="card-title mb-0">Cake Order Finalization</h1>
                    </div>
                    <div class="card-body">
                        <h2>General Inquiries</h2>
                        <form action="confirmation.html" id="contactform">
                            <div class="mb-3">
                                <label for="Fullname" class="form-label">Name: *</label>
                                <input required type="text" id="Fullname" name="Fullname" class="form-control" />
                            </div>

                            <div class="mb-3">
                                <label for="exampleFormControlInput1" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Would you like to proceed with your order?</label>
                                <div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" value="Y" name="Service" id="yes">
                                        <label class="form-check-label" for="yes">Yes</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" value="N" name="Service" id="no">
                                        <label class="form-check-label" for="no">No</label>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="input-group">
                                    <input placeholder="📌 place address here" type="text" class="form-control" />
                                    <button class="btn btn-outline-secondary" type="button" onclick="ClearForm()">Delivery Pickup</button>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="Payment" class="form-label">Payment Method:</label>
                                <select id="Payment" name="Payment" class="form-select">
                                    <option value="Credit Card">Credit Card</option>
                                    <option value="Debit Card">Debit Card</option>
                                    <option value="PayPal">PayPal</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="CardHolderName" class="form-label">Card Holder Name:</label>
                                <input required type="text" id="CardHolderName" name="CardHolderName" class="form-control" />
                            </div>

                            <div class="mb-3">
                                <label for="CardNumber" class="form-label">Card Number:</label>
                                <input required type="text" id="CardNumber" name="CardNumber" class="form-control" />
                            </div>

                            <div class="mb-3">
                                <label for="CVV" class="form-label">CVV:</label>
                                <input required type="text" id="CVV" name="CVV" class="form-control" />
                            </div>

                            <div class="mb-3">
                                <label for="inquiry" class="form-label">State Any Other Inquiry *</label>
                                <textarea required cols="50" rows="10" maxlength="150" id="inquiry" name="inquiry" class="form-control"></textarea>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="submit" class="btn btn-primary me-md-2">Submit</button>
                                <button type="button" onclick="ClearForm()" class="btn btn-secondary">Clear</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="container p-4">
            <!-- Footer content -->
        </div>
    </footer>
    <script src="javascript/site.js"></script>

    </div>

</body>

</html>
